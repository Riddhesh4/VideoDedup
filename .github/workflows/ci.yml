name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VideoDedup.slnx

      - name: Build (warnings are errors)
        run: dotnet build VideoDedup.slnx --no-restore -c Release

      - name: Restore local tools
        run: dotnet tool restore

      # Offline audit: every centrally pinned package must be allow-listed with a recorded license, and every
      # dependency in THIRD-PARTY.md must match what the build actually references.
      - name: Dependency and license audit
        shell: pwsh
        run: ./scripts/check-dependencies.ps1

      - name: Collect Domain coverage
        run: dotnet tool run dotnet-coverage -- collect -o TestResults/Domain-Coverage.cobertura.xml -f cobertura dotnet test --project tests/VideoDedup.Domain.Tests/VideoDedup.Domain.Tests.csproj -c Release --no-build

      - name: Enforce Domain coverage threshold
        run: pwsh -File scripts/check-domain-coverage.ps1

      # global.json opts the solution into the MTP mode of dotnet test;
      # MTP filters are passed after -- in xUnit v3 native syntax.
      - name: Prepare audited LGPL media tools and fixture
        run: python scripts/prepare-media.py

      - name: Test (all)
        shell: pwsh
        run: |
          dotnet test VideoDedup.slnx --no-build -c Release -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false 2>&1 |
            Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          # Workflow logs require a signed-in GitHub account, so mirror the diagnostics into check annotations.
          $failed = @(Select-String -Path tests.log -Pattern '^\s*(failed|error|Error|Exit code|Unhandled)|Exception(:| )' |
            ForEach-Object { ($_.Line -replace '\s+', ' ').Trim() } | Select-Object -Unique -First 10)
          foreach ($line in $failed) {
            Write-Host ("::error title=Test-failure::" + ($line -replace '%', '%25'))
          }
          $tail = ((Get-Content tests.log -Tail 25) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          Write-Host ("::error title=Test-log-tail::$tail")
          exit $code

      - name: Publish desktop checkpoint (no bundled media)
        run: powershell -NoProfile -File scripts/package-desktop.ps1

      # The tester build is the same artifact the release script zips locally, so an end user can download exactly
      # what CI verified instead of a locally built binary.
      - name: Upload tester build
        uses: actions/upload-artifact@v4
        with:
          name: VideoDedup-tester-win-x64
          path: |
            publish/desktop/**
            docs/PRIVACY.md
            docs/THREAT-MODEL.md
            docs/RELEASE.md
            docs/MEDIA-COMPLIANCE.md
            THIRD-PARTY.md
          retention-days: 30

      # RE-hardening gate: prove obfuscation runs and strips type names.
      - name: Obfuscation smoke test
        run: |
          dotnet publish src/VideoDedup.Domain/VideoDedup.Domain.csproj -c Release -o publish
          dotnet tool restore
          pwsh -Command "& '$env:GITHUB_WORKSPACE/scripts/obfuscate.ps1'"
          pwsh -Command "
            $bytes = [IO.File]::ReadAllBytes('publish/VideoDedup.Domain.dll');
            $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes);
            if ($text.Contains('ScanState') -or $text.Contains('IScanOrchestrator')) {
              Write-Error 'Obfuscation gate failed: recognizable type names survived in VideoDedup.Domain.dll';
              exit 1
            }
            Write-Host 'Obfuscation gate passed: type names stripped.'
          "
