name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VideoDedup.slnx

      - name: Build (warnings are errors)
        run: dotnet build VideoDedup.slnx --no-restore -c Release

      # global.json opts the solution into the MTP mode of dotnet test;
      # MTP filters are passed after -- in xUnit v3 native syntax.
      - name: Test (all)
        run: dotnet test VideoDedup.slnx --no-build -c Release -- --filter-class-name *_Tests

      # RE-hardening gate: prove obfuscation runs and strips type names.
      - name: Obfuscation smoke test
        run: |
          dotnet publish src/VideoDedup.Domain/VideoDedup.Domain.csproj -c Release -o publish
          dotnet tool restore
          pwsh -Command "& '$env:GITHUB_WORKSPACE/scripts/obfuscate.ps1'"
          pwsh -Command "
            $bytes = [IO.File]::ReadAllBytes('publish/VideoDedup.Domain.dll');
            $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes);
            if ($text.Contains('ScanState') -or $text.Contains('IScanOrchestrator')) {
              Write-Error 'Obfuscation gate failed: recognizable type names survived in VideoDedup.Domain.dll';
              exit 1
            }
            Write-Host 'Obfuscation gate passed: type names stripped.'
          "
